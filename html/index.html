<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h2>-- FORMULÁRIO --</h2>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" name="name" id="nome" required placeholder="Preencha seu nome completo..">
        <br>
        <br>
        <label for="cpf">CPF:</label>
        <input type="text" name="cpf" id="cpf" required placeholder="Preencha com seu CPF..">
        <br>
        <br>
        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" required placeholder="Preencha com seu e-mail..">
        <br>
        <br>
        <label for="telefone">Telefone:</label>
        <input type="tel" name="telefone" id="telefone" placeholder="Preencha com seu telefone..">
        <br>
        <br>
        <label for="senha">Senha:</label>
        <input type="text" name="senha" id="senha" required placeholder="Preencha com sua senha..">
        <br>
        <br>
        <button typy="submit">Enviar</button>

    </form>
    
</body>
</html>
