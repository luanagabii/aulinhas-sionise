<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos</title>
</head>
<body>
     <h2>-- CADASTRAR PRODUTOS --</h2>

    <form>
        <label for="produto">Produto:</label>
        <input type="text" name="produto" id="produto" required placeholder="Adicione o nome do produto..">
        <br>
        <br>
        <label for="descricao">Descrição:</label>
        <input type="text" name="descricao" id="descricao" required placeholder="Adicionar descrição do produto..">
        <br>
        <br>
        <label for="cor">Cor:</label>
        <input type="color" name="cor" id="cor">
        <br>
        <br>
        <label for="marca">Marca:</label>
        <input type="text" name="marca" id="marca"  required placeholder="Adicionar a marca do produto..">
        <br>
        <br>
        <label for="tamanho">Tamanho:</label>
        <input type="text" name="tamanho" id="tamanho" required placeholder="Adicionar o tamanho do produto..">
        <br>
        <br>
        <label for="quantidade">Quantidade:</label>
        <input type="number" name="quantidade" id="quantidade" required placeholder="Adicionar a quantidade de produtos">
        <br>
        <br>
        <label for="prec_investido">Preço Investido:</label>
        <input type="number" name="prec_investido" id="prec_investido" required placeholder="Adicionar o preço investido..">
        <br>
        <br>
        <label for="prec_venda">Preço venda:</label>
        <input type="number" name="prec_venda" id="prec_venda" required placeholder="Adicionar com o preço para venda..">
        <br>
        <br>
        <label for="obcervacao">Obcervação:</label>
        <input type="text" name="obcervacao" id="obcervacao" required placeholder="Adiconar a obcervação do produto..">
        <br>
        <br>
        <label for="foto_produt">Foto Produto:</label>
        <input type="file" name="foto_produt" id="foto_produt" required placeholder="Adicionar foto do produto..">
        <br>
        <br>
        <button typy="submit">Enviar</button>

    </form>
    
</body>
</html>
